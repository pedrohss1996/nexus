[variables]
# Evita que o Puppeteer tente baixar o próprio Chromium
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"

[phases.setup]
nixPkgs = [
  "nodejs_18", 
  "chromium", 
  "nss", 
  "freetype", 
  "harfbuzz", 
  "dejavu_fonts", 
  "fontconfig"
]
# Ajustado libasound2 -> libasound2t64 para compatibilidade com Ubuntu 24.04
aptPkgs = [
  "libnss3", 
  "libatk1.0-0", 
  "libatk-bridge2.0-0", 
  "libcups2", 
  "libgbm1", 
  "libasound2t64", 
  "libpangocairo-1.0-0", 
  "libxss1", 
  "libgtk-3-0", 
  "libxshmfence1", 
  "libglu1"
]

[phases.install]
cmds = ["npm install"]

[phases.build]
# Garante que o install rodou antes do build
dependsOn = ["install"]
cmds = ["npm run build:css"]

[start]
cmd = "npm run migrate && NODE_ENV=production node server.js"
